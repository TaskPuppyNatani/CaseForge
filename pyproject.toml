[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-case-generator"
version = "1.0.0"
description = "Generate software-engineering benchmark test cases using Qwen models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
generate-tests = "benchmark_case_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark_case_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
