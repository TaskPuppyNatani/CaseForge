[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caseforge"
version = "2.0.0"
description = "GUI application for generating software-engineering benchmark test cases using Qwen models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyside6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.gui-scripts]
caseforge = "benchmark_case_generator.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark_case_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
